plugins {
    id "com.android.application"
}

dependencies {
    implementation "com.tencent:mmkv:2.4.2"
}

def qingjianAssets = layout.buildDirectory.dir("generated/qingjianAssets")
def releaseKeystore = System.getenv("YAGAMI_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("YAGAMI_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("YAGAMI_KEY_ALIAS")
def releaseKeyPassword = System.getenv("YAGAMI_KEY_PASSWORD")
def hasReleaseSigning = [
        releaseKeystore,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { value -> value != null && !value.isBlank() }

tasks.register("prepareQingjianAssets", Copy) {
    from(rootProject.file("../../assets/lexicon/dict.tsv"))
    from(rootProject.file("../../assets/glossary/glossary-en.tsv"))
    into(qingjianAssets)
}

android {
    namespace "io.github.utyoinog.yagamiime"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "io.github.utyoinog.yagamiime"
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName "0.2.7"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    sourceSets {
        main.jniLibs.srcDirs = ["src/main/jniLibs"]
        main.assets.srcDir(qingjianAssets)
    }

    useLibrary "android.test.runner"
    useLibrary "android.test.base"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareQingjianAssets")
}
